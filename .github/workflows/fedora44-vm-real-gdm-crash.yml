name: Fedora 44 real GDM crash recovery (disposable VM)

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/gnome50-lockscreen
    paths:
      - .github/workflows/fedora44-vm-real-gdm-crash.yml
      - scripts/fedora44_vm_real_gdm_crash_check.sh
      - experiments/gdm/vm_real_crash_injector.py
      - experiments/gdm/vm_real_transaction.py

permissions:
  contents: read

concurrency:
  group: veilpaper-disposable-fedora44-gdm-crash
  cancel-in-progress: true

jobs:
  real-gdm-sigkill-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated guest crash harness syntax
        run: bash -n scripts/fedora44_vm_real_gdm_crash_check.sh
      - name: Kill real guest GDM swap, reboot and restore RPM-original resource
        run: bash scripts/fedora44_vm_real_gdm_crash_check.sh
